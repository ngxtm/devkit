name: Sync Skills from Upstreams

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if no changes detected'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Clone upstream repositories
        run: |
          # Clone antigravity-awesome-skills
          git clone --depth 1 https://github.com/sickn33/antigravity-awesome-skills.git /tmp/antigravity

          # Clone agent-assistant
          git clone --depth 1 https://github.com/hainamchung/agent-assistant.git /tmp/agent-assistant

      - name: Merge skills
        id: merge
        run: |
          python scripts/sync_skills.py \
            --primary /tmp/antigravity/skills \
            --secondary /tmp/agent-assistant/skills \
            --target ./skills \
            --config SYNC_CONFIG.yaml

      - name: Update matrix indexes
        run: |
          python scripts/update_matrix.py

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(skills): auto-sync from upstream sources"
          title: "[Auto-Sync] Update skills from upstream"
          body: |
            ## Automated Skill Sync

            This PR was automatically generated by the sync workflow.

            ### Sources synced:
            - `sickn33/antigravity-awesome-skills`
            - `hainamchung/agent-assistant`

            ### Changes:
            - See commit diff for details

            ---
            *Generated by GitHub Actions*
          branch: auto-sync/skills
          labels: |
            automated
            skills-sync
          delete-branch: true
